name: Multiplatform CI

on:
  push:
    branches: [ main, feature/kmp-migration ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Shared Unit Tests
      run: ./gradlew :shared:testDebugUnitTest

    - name: Run Android App Unit Tests
      run: ./gradlew :composeApp:testDebugUnitTest

    - name: Build Android Debug APK
      run: ./gradlew :composeApp:assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Shared iOS Unit Tests
      run: ./gradlew :shared:iosSimulatorArm64Test

    # This step assumes an Xcode project exists in the iosApp directory
    # - name: Build iOS App
    #   run: |
    #     cd iosApp
    #     xcodebuild -scheme iosApp -sdk iphonesimulator -configuration Debug build
